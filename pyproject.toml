[project]
name = "apple-health-transmitter"
version = "0.1.0"
description = "Replicate Apple Health data to a persisted data source"
requires-python = ">=3.12"
dependencies = [
    "click>=8.0",
]

[project.scripts]
apple-health-transmitter = "apple_health_transmitter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apple_health_transmitter"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9.0",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
